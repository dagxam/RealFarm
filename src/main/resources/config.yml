# RealFarm — основной конфиг
# Пока используются только стандартные блоки и предметы Minecraft.

farm:
  enabled: true
  # Минимальный размер квадрата — 3x3.
  # Внутри: пашня, один котёл и рядом с ним один компостер.
  max-size: 15

water:
  # Полностью заполненный водой котёл работает случайно 2–3 игровых дня,
  # затем вода расходуется полностью.
  consume-after-days-min: 2
  consume-after-days-max: 3

fertilizer:
  # Компостер заполняется только костной мукой.
  # Полный компостер ускоряет рост 3–5 игровых дней.
  duration-days-min: 3
  duration-days-max: 5
  growth-multiplier: 2

crops:
  growth-days-min: 2
  growth-days-max: 5
  wheat:
    enabled: true
  carrot:
    enabled: true
  potato:
    enabled: true
  beetroot:
    enabled: true
  torchflower:
    enabled: true
  pitcher:
    enabled: true

# Будущие культуры RealFarm будут добавлены поверх этой системы.
future-crops:
  corn: true
  tomato: true
  cucumber: true
  cabbage: true

seasons:
  integration-enabled: false
