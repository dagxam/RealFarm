# RealFarm — основной конфиг
# Пока используются только стандартные блоки и предметы Minecraft.

farm:
  enabled: true
  min-size: 3
  max-size: 15

water:
  # Любого количества воды достаточно для увлажнения участка.
  # Вода расходуется случайно через 2–3 игровых дня.
  consume-after-days-min: 2
  consume-after-days-max: 3

fertilizer:
  # Компостер фермы заполняется только костной мукой.
  duration-days-min: 3
  duration-days-max: 5
  growth-multiplier: 2

crops:
  growth-days-min: 2
  growth-days-max: 5
  wheat:
    enabled: true
  carrot:
    enabled: true
  potato:
    enabled: true
  beetroot:
    enabled: true
  torchflower:
    enabled: true
  pitcher:
    enabled: true

trees:
  # Саженцы, посаженные на пашню RealFarm, растут под контролем плагина.
  growth-days-min: 2
  growth-days-max: 5
  # Саженцы вне пашни RealFarm используют обычный рост Minecraft.

rain-growth:
  # Отдельная природная система: во время дождя ускоряет траву и саженцы вне участков RealFarm.
  enabled: true
  # Количество случайных природных точек в каждом загруженном мире за один цикл проверки.
  attempts-per-run: 8
  # Вероятность роста обычного саженца при попадании в него проверки.
  sapling-chance: 0.35
  # Вероятность роста травы/папоротника при попадании в него проверки.
  grass-chance: 0.45

future-crops:
  corn: true
  tomato: true
  cucumber: true
  cabbage: true

seasons:
  integration-enabled: false
