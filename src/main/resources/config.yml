# RealFarm — основной конфиг
# Пока используются только стандартные блоки и предметы Minecraft.

farm:
  enabled: true
  # Квадрат строится из любых обычных блоков по периметру.
  # Внутри должны быть пашня и не более одного котла.
  min-size: 3
  max-size: 15

water:
  # Котёл должен быть полностью заполнен водой.
  # Полный котёл работает случайно 2–3 игровых дня,
  # затем вода расходуется полностью.
  consume-after-days-min: 2
  consume-after-days-max: 3

fertilizer:
  # Рядом с котлом можно поставить один стандартный компостер.
  # Он заполняется только костной мукой.
  # Полный компостер ускоряет рост 3–5 игровых дней.
  duration-days-min: 3
  duration-days-max: 5
  growth-multiplier: 2

crops:
  # Полный рост каждой культуры занимает случайно 2–5 игровых дней.
  growth-days-min: 2
  growth-days-max: 5
  wheat:
    enabled: true
  carrot:
    enabled: true
  potato:
    enabled: true
  beetroot:
    enabled: true
  torchflower:
    enabled: true
  pitcher:
    enabled: true

# Будущие культуры RealFarm будут добавлены поверх этой системы.
future-crops:
  corn: true
  tomato: true
  cucumber: true
  cabbage: true

seasons:
  integration-enabled: false
